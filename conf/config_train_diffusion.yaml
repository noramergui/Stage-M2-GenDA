hydra:
  job:
    chdir: true
    name: gulfstream_100kimg
  run:
    dir: /data2/nora/GenDA_workspace/experiments/${hydra:job.name}

defaults:
  - config_train_base

## Main options
outdir: "."          # "." = le dossier courant, qui est le dir Hydra ci-dessus
task: diffusion

total_kimg: 100          # 100 000 images

batch_size_global: 64

batch_size_gpu: 64

ema_halflife_kimg: 1  

lr_rampup_kimg: 1 

dump: 10

validation_dump: 10

